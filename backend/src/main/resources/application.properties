spring.application.name=milly-backend
server.port=${PORT:8080}

# SQLite Configuration
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./}/milly.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://milly-3len.vercel.app}
app.demo-data.enabled=${APP_DEMO_DATA_ENABLED:true}
app.journal.initial-pin=${MILLY_INITIAL_JOURNAL_PIN:}

# File upload / limits if needed
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
